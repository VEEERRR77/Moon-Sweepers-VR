## Settings file was created by plugin Moon XR Starter v1.0.0
## Plugin GUID: claude.moonxrstarter

[Comfort]

## Turn the game's motion blur off while in VR (it is uncomfortable in a headset).
# Setting type: Boolean
# Default value: true
Disable Motion Blur = true

## Remove the dark shaded edges the game draws around the screen.
# Setting type: Boolean
# Default value: true
Disable Vignette = true

[Hand HUD]

## Show the in-game HUD (tool slots, money etc.) on a hand instead of in front of you: Left, Right or Off.
# Setting type: String
# Default value: Left
Hand = Left

## Comma-separated names of the game's HUD screens to put on the hand. The first one also receives the dust panel, money and notices from the main HUD (the tool belt and compass stay in front of you).
# Setting type: String
# Default value: Save indicator HUD, Money popups
Screens = Save indicator HUD, Money popups

## Width of the hand HUD panel, in metres.
# Setting type: Single
# Default value: 0.5
Width = 0.5

## How far above the controller the hand HUD floats, in metres.
# Setting type: Single
# Default value: 0.12
Height Above Hand = 0.12

[Head Tracking]

## Apply headset rotation/position to the game camera.
# Setting type: Boolean
# Default value: true
Enabled = true

## Also apply head position (lean). Turn off for rotation only.
# Setting type: Boolean
# Default value: true
Position Tracking = true

## Raises (+) or lowers (-) your view, in metres. Adjust in-game with LB+RB + D-pad up/down, or F11/F10.
# Setting type: Single
# Default value: -0.2
Height Offset = -0.2

## Moves your held tool up (+) or down (-) without moving your view, in metres. Adjust in-game with LB+RB + D-pad right/left.
# Setting type: Single
# Default value: -0.25
Tool Height Offset = -0.25

[Motion Controls]

## EXPERIMENTAL: sweep where the right controller points, and use Quest sticks/triggers.
# Setting type: Boolean
# Default value: true
Enabled = true

## Aim/clean from the right controller.
# Setting type: Boolean
# Default value: true
Hand Aim = true

## Feed Quest sticks/triggers into the game.
# Setting type: Boolean
# Default value: true
Controller Input = true

## Point your right hand at things to highlight / pick up / use them (instead of looking at them).
# Setting type: Boolean
# Default value: true
Hand Interaction = true

## How far below the controller's pointing direction the sweep ray aims, in degrees.
# Setting type: Single
# Default value: 35
Hand Aim Pitch = 35

## Hide the brush aiming reticle while the sweep trigger is held (cleaning still works).
# Setting type: Boolean
# Default value: true
Hide Reticle While Sweeping = true

## Show a laser from the right hand when you're not sweeping, to make pointing at buttons and items easier.
# Setting type: Boolean
# Default value: true
Laser Pointer = true

## Maximum laser length in metres (it stops at whatever it hits).
# Setting type: Single
# Default value: 5
Laser Length = 5

## Never show the brush aiming reticle (cleaning still works).
# Setting type: Boolean
# Default value: true
Hide Reticle = true

## Laser brightness, 0 (black) to 1 (full).
# Setting type: Single
# Default value: 0.03
Laser Brightness = 0.03

## Laser colour: Yellow, Blue, Red, Green, White. Change in game with both grips + right stick left/right.
# Setting type: String
# Default value: White
Laser Colour = Red

[VR UI]

## How far in front of you the menu/HUD panel floats, in metres.
# Setting type: Single
# Default value: 1.5
Distance = 1.5

## Width of the menu/HUD panel, in metres.
# Setting type: Single
# Default value: 2.4
Width = 4.2

## Moves the panel up (+) or down (-), in metres.
# Setting type: Single
# Default value: 0
Height Offset = 0.6

## How tightly the panel follows you. Higher = snappier, lower = smoother. 0 = locked to the camera.
# Setting type: Single
# Default value: 15
Smoothing = 0

## Re-position the panel just before drawing to remove stutter. Turn off if menus disappear.
# Setting type: Boolean
# Default value: true
Render Time Placement = true

## Comma-separated names of UI pieces to hide in VR (e.g. screen borders). The log lists candidates.
# Setting type: String
# Default value: HUD shade
Hide Elements = HUD shade

## Write full-screen UI pieces and edge strips to the log, to find borders to hide.
# Setting type: Boolean
# Default value: true
Log Large Elements = false

